<svg xmlns="http://www.w3.org/2000/svg" id="figure-inference-svg" class="knowledge-concept-figure-svg" viewBox="0 0 760 455" role="group" aria-labelledby="figure-inference-title figure-inference-description" data-figure-step="inference"><title id="figure-inference-title">双记忆进入一次新预测</title><desc id="figure-inference-description">F/R 两路进入搜证与概率示意。图中箭头是方法输入/输出关系，不是把 F/R 声称成独立可加模块。</desc><defs><marker id="figure-inference-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8175"/></marker></defs><rect x="0" y="0" width="760" height="455" rx="20" fill="#fbfaf4"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#26332d" text-anchor="start">F 引导搜什么，R 引导信多少，Agent 留下预测过程</text><line x1="164" y1="184" x2="204" y2="88" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-inference-arrow)"/><text x="184" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">F</text><line x1="164" y1="217" x2="204" y2="298" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-inference-arrow)"/><text x="184" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">R</text><line x1="340" y1="89" x2="382" y2="89" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-inference-arrow)"/><text x="361" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">看什么</text><line x1="518" y1="89" x2="382" y2="277" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-inference-arrow)"/><text x="450" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">带入搜证</text><line x1="340" y1="299" x2="382" y2="277" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-inference-arrow)"/><text x="361" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">信多少</text><line x1="518" y1="262" x2="566" y2="95" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-inference-arrow)"/><text x="542" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">保留过程</text><line x1="518" y1="296" x2="566" y2="279" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-inference-arrow)"/><text x="542" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">输出分布</text><g id="figure-inference-memory" data-figure-atom="memory" data-figure-step="inference" data-figure-part="memory" role="button" tabindex="0" aria-label="双记忆：子类别索引到的 F/R 双记忆状态。"><title>子类别双记忆状态：子类别索引到的 F/R 双记忆状态。</title><rect x="28" y="154" width="136" height="92" rx="16" fill="#f4ecd9" stroke="#6e8175" stroke-width="2" /><text x="96" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="middle">双记忆</text><text x="96" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">取回 M</text></g><g id="figure-inference-factor" data-figure-atom="factor" data-figure-step="inference" data-figure-part="factor" role="button" tabindex="0" aria-label="F · 看什么：F 提示要看哪些信号和怎样核对证据。"><title>因子记忆 F：F 提示要看哪些信号和怎样核对证据。</title><rect x="204" y="48" width="136" height="82" rx="16" fill="#e4f0e4" stroke="#6e8175" stroke-width="2" /><text x="272" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">F · 看什么</text><text x="272" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">搜证提示</text></g><g id="figure-inference-signal" data-figure-atom="signal" data-figure-step="inference" data-figure-part="signal" role="button" tabindex="0" aria-label="当前信号：当前搜证中需要检查的证据维度。"><title>预测信号：当前搜证中需要检查的证据维度。</title><rect x="382" y="48" width="136" height="82" rx="16" fill="#e5eef6" stroke="#6e8175" stroke-width="2" /><text x="450" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">当前信号</text><text x="450" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">查证据</text></g><g id="figure-inference-reasoning" data-figure-atom="reasoning" data-figure-step="inference" data-figure-part="reasoning" role="button" tabindex="0" aria-label="R · 信多少：R 提示证据强弱、冲突和缺失怎样改变信心。"><title>推理记忆 R：R 提示证据强弱、冲突和缺失怎样改变信心。</title><rect x="204" y="258" width="136" height="82" rx="16" fill="#ece7f5" stroke="#6e8175" stroke-width="2" /><text x="272" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">R · 信多少</text><text x="272" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">概率推理</text></g><g id="figure-inference-agent" data-figure-atom="agent" data-figure-step="inference" data-figure-part="agent" role="button" tabindex="0" aria-label="Agent：Agent 综合当时可用证据与记忆形成预测。"><title>Agent（预测代理）：Agent 综合当时可用证据与记忆形成预测。</title><rect x="382" y="232" width="136" height="92" rx="16" fill="#e4f0e4" stroke="#6e8175" stroke-width="2" /><text x="450" y="259" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="middle">Agent</text><text x="450" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">搜证 + 推理</text></g><g id="figure-inference-trajectory" data-figure-atom="trajectory" data-figure-step="inference" data-figure-part="trajectory" role="button" tabindex="0" aria-label="预测轨迹：保留结果揭晓前的搜证、解释与判断过程。"><title>预测轨迹：保留结果揭晓前的搜证、解释与判断过程。</title><rect x="566" y="48" width="166" height="94" rx="16" fill="#e5eef6" stroke="#6e8175" stroke-width="2" /><text x="649" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">预测轨迹</text><text x="649" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">结果前记录</text></g><g id="figure-inference-probability" data-figure-atom="probability" data-figure-step="inference" data-figure-part="probability" role="button" tabindex="0" aria-label="概率分布：输出候选结果的完整概率分布。"><title>概率预测：输出候选结果的完整概率分布。</title><rect x="566" y="232" width="166" height="94" rx="16" fill="#f4e3df" stroke="#6e8175" stroke-width="2" /><text x="649" y="259" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">概率分布</text><text x="649" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">结果前答案</text></g><g id="figure-inference-protocol" data-figure-atom="protocol" data-figure-step="inference" data-figure-part="protocol" role="button" tabindex="0" aria-label="时间协议：预测只能使用结果揭晓前可获得的信息。"><title>时间有效的实验协议：预测只能使用结果揭晓前可获得的信息。</title><rect x="28" y="370" width="704" height="72" rx="16" fill="#fbfaf4" stroke="#6e8175" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="397" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">时间协议</text><text x="46" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">当前信息边界</text></g></svg>