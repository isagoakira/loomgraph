<svg xmlns="http://www.w3.org/2000/svg" id="figure-memory-problem-svg" class="knowledge-concept-figure-svg" viewBox="0 0 760 390" role="group" aria-labelledby="figure-memory-problem-title figure-memory-problem-description" data-figure-step="memory-problem"><title id="figure-memory-problem-title">从一次结果记录到可复用原则</title><desc id="figure-memory-problem-description">经验抽象为两类原则示意。两类原则是教学分工；不表示论文把它们做成可独立相加的因果模块。</desc><defs><marker id="figure-memory-problem-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8175"/></marker></defs><rect x="0" y="0" width="760" height="390" rx="20" fill="#fbfaf4"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#26332d" text-anchor="start">保存一次答案还不够：要抽象未来如何搜证与控制信心</text><line x1="192" y1="152" x2="246" y2="86" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-memory-problem-arrow)"/><text x="219" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">抽象</text><line x1="192" y1="152" x2="246" y2="214" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-memory-problem-arrow)"/><text x="219" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">抽象</text><line x1="440" y1="87" x2="500" y2="135" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-memory-problem-arrow)"/><text x="470" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">原则 1</text><line x1="440" y1="215" x2="500" y2="178" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-memory-problem-arrow)"/><text x="470" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">原则 2</text><line x1="612" y1="220" x2="395" y2="294" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-memory-problem-arrow)"/><text x="503.5" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">组织 / 修订</text><line x1="235" y1="318" x2="500" y2="238" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative" stroke-dasharray="7 6" marker-end="url(#figure-memory-problem-arrow)"/><text x="367.5" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">守时序</text><g id="figure-memory-problem-record" data-figure-atom="lesson" data-figure-step="memory-problem" data-figure-part="record" role="button" tabindex="0" aria-label="一次结果记录：用于讲解经验抽象的已揭晓个例：从看到的信号与实际结果中提炼未来可复用的原则。此部件引用可复用原则，未提前引入完整复盘轨迹。"><title>可复用原则：用于讲解经验抽象的已揭晓个例：从看到的信号与实际结果中提炼未来可复用的原则。此部件引用可复用原则，未提前引入完整复盘轨迹。</title><rect x="30" y="108" width="162" height="88" rx="16" fill="#f4e3df" stroke="#b6c8b8" stroke-width="2" /><text x="44" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">一次结果记录</text><rect x="44" y="146" width="134" height="38" rx="8" fill="#ffffff" stroke="#b6c8b8"/><circle cx="57" cy="159" r="4" fill="#8fb896"/><text x="68" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">看到的信号</text><circle cx="57" cy="177" r="4" fill="#d5a982"/><text x="68" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">实际结果</text></g><g id="figure-memory-problem-signal" data-figure-atom="signal" data-figure-step="memory-problem" data-figure-part="signal" role="button" tabindex="0" aria-label="看什么：信号：从记录中抽象未来搜证时要检查的证据维度。"><title>预测信号：从记录中抽象未来搜证时要检查的证据维度。</title><rect x="246" y="42" width="194" height="110" rx="16" fill="#e5eef6" stroke="#b6c8b8" stroke-width="2" /><text x="260" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">看什么：信号</text><rect x="260" y="80" width="166" height="66" rx="8" fill="#ffffff" stroke="#b6c8b8"/><path d="M272 92 h10 M272 120 h10" stroke="#6e8175" stroke-width="2"/><text x="290" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">覆盖与时间</text><text x="290" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">定义与适用</text></g><g id="figure-memory-problem-calibration" data-figure-atom="calibration" data-figure-step="memory-problem" data-figure-part="calibration" role="button" tabindex="0" aria-label="信多少：校准：从记录中抽象未来怎样控制信心的原则。"><title>校准：从记录中抽象未来怎样控制信心的原则。</title><rect x="246" y="170" width="194" height="90" rx="16" fill="#ece7f5" stroke="#b6c8b8" stroke-width="2" /><text x="260" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">信多少：校准</text><text x="260" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">弱证据</text><rect x="318" y="211" width="106" height="10" rx="5" fill="#d5a982"/><text x="260" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">冲突 / 缺失</text><rect x="318" y="233" width="106" height="10" rx="5" fill="#c8b6d8"/></g><g id="figure-memory-problem-lesson" data-figure-atom="lesson" data-figure-step="memory-problem" data-figure-part="lesson" role="button" tabindex="0" aria-label="可复用原则：把一次记录压缩成能服务未来问题的可复用原则。"><title>可复用原则：把一次记录压缩成能服务未来问题的可复用原则。</title><rect x="500" y="88" width="224" height="132" rx="16" fill="#f4ecd9" stroke="#b6c8b8" stroke-width="2" /><text x="516" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="start">可复用原则</text><rect x="516" y="130" width="192" height="30" rx="8" fill="#ffffff" stroke="#b6c8b8"/><text x="528" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">检查什么：证据清单</text><rect x="516" y="166" width="192" height="30" rx="8" fill="#ffffff" stroke="#b6c8b8"/><text x="528" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">控制信心：适度更新</text><text x="516" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">不是旧答案副本</text></g><g id="figure-memory-problem-foco" data-figure-atom="foco" data-figure-step="memory-problem" data-figure-part="foco" role="button" tabindex="0" aria-label="FoCo：组织与修订：组织并修订预测专用记忆的方法入口。"><title>ForecastCompass（FoCo）：组织并修订预测专用记忆的方法入口。</title><rect x="270" y="294" width="250" height="72" rx="16" fill="#e4f0e4" stroke="#6e8175" stroke-width="2" /><text x="395" y="321" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">FoCo：组织与修订</text><text x="395" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">接入未来问题</text></g><g id="figure-memory-problem-protocol" data-figure-atom="protocol" data-figure-step="memory-problem" data-figure-part="protocol" role="button" tabindex="0" aria-label="守住时间边界：经验只能从当时允许的时间信息中提炼。"><title>时间有效的实验协议：经验只能从当时允许的时间信息中提炼。</title><rect x="30" y="294" width="205" height="72" rx="16" fill="#fbfaf4" stroke="#6e8175" stroke-width="2" stroke-dasharray="8 6"/><text x="48" y="321" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">守住时间边界</text><text x="48" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">结果后材料服务未来</text></g></svg>