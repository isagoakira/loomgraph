<svg xmlns="http://www.w3.org/2000/svg" id="figure-signal-confidence-svg" class="knowledge-concept-figure-svg" viewBox="0 0 760 355" role="group" aria-labelledby="figure-signal-confidence-title figure-signal-confidence-description" data-figure-step="signal-confidence"><title id="figure-signal-confidence-title">信号、信心与校准</title><desc id="figure-signal-confidence-description">证据信号到校准判断示意。信号不自动等于答案；所有信号都受时间协议约束。</desc><defs><marker id="figure-signal-confidence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8175"/></marker></defs><rect x="0" y="0" width="760" height="355" rx="20" fill="#fbfaf4"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#26332d" text-anchor="start">证据影响判断，但信心还要接受一组预测的校准检查</text><line x1="234" y1="137" x2="278" y2="123" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-signal-confidence-arrow)"/><text x="256" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">进入判断</text><line x1="470" y1="123" x2="514" y2="113" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-signal-confidence-arrow)"/><text x="492" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">检查匹配</text><g id="figure-signal-confidence-signal" data-figure-atom="signal" data-figure-step="signal-confidence" data-figure-part="signal" role="button" tabindex="0" aria-label="当前证据信号：当前证据中需要检查适用范围的信号维度。"><title>预测信号：当前证据中需要检查适用范围的信号维度。</title><rect x="30" y="82" width="204" height="110" rx="16" fill="#e5eef6" stroke="#6e8175" stroke-width="2" /><text x="132" y="109" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="middle">当前证据信号</text><text x="132" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">看到了什么？</text></g><g id="figure-signal-confidence-confidence" data-figure-atom="confidence" data-figure-step="signal-confidence" data-figure-part="confidence" role="button" tabindex="0" aria-label="预测信心：一次预测分布中的最大候选概率。"><title>预测信心：一次预测分布中的最大候选概率。</title><rect x="278" y="68" width="192" height="126" rx="16" fill="#e4f0e4" stroke="#b6c8b8" stroke-width="2" /><text x="296" y="99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="start">预测信心</text><circle cx="303" cy="140" r="6" fill="#8fb896" stroke="#26332d" stroke-width="1.4"/><circle cx="318" cy="140" r="6" fill="#8fb896" stroke="#26332d" stroke-width="1.4"/><circle cx="333" cy="140" r="6" fill="#8fb896" stroke="#26332d" stroke-width="1.4"/><circle cx="348" cy="140" r="6" fill="#8fb896" stroke="#26332d" stroke-width="1.4"/><circle cx="363" cy="140" r="6" fill="#8fb896" stroke="#26332d" stroke-width="1.4"/><circle cx="378" cy="140" r="6" fill="#8fb896" stroke="#26332d" stroke-width="1.4"/><circle cx="393" cy="140" r="6" fill="#8fb896" stroke="#26332d" stroke-width="1.4"/><circle cx="408" cy="140" r="6" fill="#f4e3df" stroke="#26332d" stroke-width="1.4"/><circle cx="423" cy="140" r="6" fill="#f4e3df" stroke="#26332d" stroke-width="1.4"/><circle cx="438" cy="140" r="6" fill="#f4e3df" stroke="#26332d" stroke-width="1.4"/><text x="296" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">0</text><text x="452" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="end">10</text><text x="296" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#607069" text-anchor="start">7/10 命中 ≈ 70%（讲解示意）</text></g><g id="figure-signal-confidence-calibration" data-figure-atom="calibration" data-figure-step="signal-confidence" data-figure-part="calibration" role="button" tabindex="0" aria-label="校准判断：一组预测的信心是否与实际正确率匹配。"><title>校准：一组预测的信心是否与实际正确率匹配。</title><rect x="514" y="58" width="216" height="146" rx="16" fill="#ece7f5" stroke="#b6c8b8" stroke-width="2" /><text x="532" y="89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="start">校准判断</text><rect x="538" y="140" width="30" height="30" rx="6" fill="#e4f0e4" stroke="#6e8175" stroke-width="1.5"/><rect x="578" y="140" width="30" height="30" rx="6" fill="#e4f0e4" stroke="#6e8175" stroke-width="1.5"/><rect x="618" y="140" width="30" height="30" rx="6" fill="#f4e3df" stroke="#6e8175" stroke-width="1.5"/><rect x="658" y="140" width="30" height="30" rx="6" fill="#f4e3df" stroke="#6e8175" stroke-width="1.5"/><text x="538" y="193" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">正确率与信心是否匹配</text></g><g id="figure-signal-confidence-protocol" data-figure-atom="protocol" data-figure-step="signal-confidence" data-figure-part="protocol" role="button" tabindex="0" aria-label="时间边界：当前信号必须来自结果揭晓前已经可获得的证据。"><title>时间有效的实验协议：当前信号必须来自结果揭晓前已经可获得的证据。</title><rect x="30" y="258" width="700" height="72" rx="16" fill="#f4ecd9" stroke="#6e8175" stroke-width="2" stroke-dasharray="8 6"/><text x="48" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">时间边界</text><text x="48" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">不把结果后信息倒灌进预测</text></g></svg>