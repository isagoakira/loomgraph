<svg xmlns="http://www.w3.org/2000/svg" id="figure-probability-svg" class="knowledge-concept-figure-svg" viewBox="0 0 760 350" role="group" aria-labelledby="figure-probability-title figure-probability-description" data-figure-step="probability"><title id="figure-probability-title">从待预测问题到概率分配</title><desc id="figure-probability-description">时间边界与概率分配示意。讲解示意，不是论文界面或本机预测结果。</desc><defs><marker id="figure-probability-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8175"/></marker></defs><rect x="0" y="0" width="760" height="350" rx="20" fill="#fbfaf4"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#26332d" text-anchor="start">先确定问题与信息时点，再把不确定性写成分布</text><line x1="200" y1="149" x2="244" y2="149" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-probability-arrow)"/><text x="222" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">围绕问题搜证</text><line x1="418" y1="149" x2="466" y2="122" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-probability-arrow)"/><text x="442" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">输出分布</text><g id="figure-probability-question" data-figure-atom="forecast-question" data-figure-step="probability" data-figure-part="question" role="button" tabindex="0" aria-label="待预测问题：明确尚未揭晓的问题和候选结果。"><title>待预测问题：明确尚未揭晓的问题和候选结果。</title><rect x="30" y="102" width="170" height="94" rx="16" fill="#e5eef6" stroke="#6e8175" stroke-width="2" /><text x="115" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="middle">待预测问题</text><text x="115" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">候选结果明确</text></g><g id="figure-probability-agent" data-figure-atom="agent" data-figure-step="probability" data-figure-part="agent" role="button" tabindex="0" aria-label="Agent：在时间有效证据内搜证、组织推理并输出概率。"><title>Agent（预测代理）：在时间有效证据内搜证、组织推理并输出概率。</title><rect x="244" y="102" width="174" height="94" rx="16" fill="#e4f0e4" stroke="#6e8175" stroke-width="2" /><text x="331" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="middle">Agent</text><text x="331" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">搜证 + 推理</text></g><g id="figure-probability-probability" data-figure-atom="probability" data-figure-step="probability" data-figure-part="probability" role="button" tabindex="0" aria-label="概率预测：给每个候选结果分配非负概率，合计为 1。"><title>概率预测：给每个候选结果分配非负概率，合计为 1。</title><rect x="466" y="64" width="264" height="172" rx="16" fill="#ffffff" stroke="#b6c8b8" stroke-width="2" /><text x="484" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="start">概率预测</text><rect x="490" y="132" width="148" height="22" rx="8" fill="#8fb896"/><rect x="490" y="176" width="64" height="22" rx="8" fill="#d5a982"/><text x="490" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#26332d" text-anchor="start">X 赢</text><text x="650.4" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#26332d" text-anchor="start">70%</text><text x="490" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#26332d" text-anchor="start">X 输</text><text x="565.6" y="193" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#26332d" text-anchor="start">30%</text><text x="490" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">讲解例：70% / 30%，非论文值</text></g><g id="figure-probability-protocol" data-figure-atom="protocol" data-figure-step="probability" data-figure-part="protocol" role="button" tabindex="0" aria-label="时间边界：结果揭晓前可用证据：限定当前预测只能使用结果揭晓前已经可获得的信息。"><title>时间有效的实验协议：限定当前预测只能使用结果揭晓前已经可获得的信息。</title><rect x="30" y="260" width="700" height="72" rx="16" fill="#f4ecd9" stroke="#6e8175" stroke-width="2" stroke-dasharray="8 6"/><text x="48" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">时间边界：结果揭晓前可用证据</text><text x="48" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">结果后信息留给复盘</text></g></svg>