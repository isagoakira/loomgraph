<svg xmlns="http://www.w3.org/2000/svg" id="figure-reproduction-svg" class="knowledge-concept-figure-svg" viewBox="0 0 760 420" role="group" aria-labelledby="figure-reproduction-title figure-reproduction-description" data-figure-step="reproduction"><title id="figure-reproduction-title">固定配置后分出独立实验臂</title><desc id="figure-reproduction-description">复现约束与比较版本示意。实验臂表示比较设计，不表示本图已经执行复现。</desc><defs><marker id="figure-reproduction-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8175"/></marker></defs><rect x="0" y="0" width="760" height="420" rx="20" fill="#fbfaf4"/><text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#26332d" text-anchor="start">先固定能解释结果的条件，再分出独立比较实验臂</text><line x1="202" y1="146" x2="268" y2="188" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-reproduction-arrow)"/><text x="235" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">固定条件</text><line x1="202" y1="293" x2="268" y2="206" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-reproduction-arrow)"/><text x="235" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">固定时序</text><line x1="440" y1="174" x2="500" y2="65" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-reproduction-arrow)"/><text x="470" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">实验臂</text><line x1="440" y1="190" x2="500" y2="189" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-reproduction-arrow)"/><text x="470" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">实验臂</text><line x1="440" y1="206" x2="500" y2="313" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-reproduction-arrow)"/><text x="470" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">实验臂</text><g id="figure-reproduction-config" data-figure-atom="config" data-figure-step="reproduction" data-figure-part="config" role="button" tabindex="0" aria-label="复现配置：固定模型、数据、时间窗口、修订设置、指标和待核实项。"><title>复现配置卡：固定模型、数据、时间窗口、修订设置、指标和待核实项。</title><rect x="24" y="92" width="178" height="122" rx="16" fill="#e5eef6" stroke="#6e8175" stroke-width="2" /><text x="113" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="middle">复现配置</text><text x="113" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">模型 / 数据 / 指标</text></g><g id="figure-reproduction-protocol" data-figure-atom="protocol" data-figure-step="reproduction" data-figure-part="protocol" role="button" tabindex="0" aria-label="时间协议：固定结果前信息边界和结果后记忆更新顺序。"><title>时间有效的实验协议：固定结果前信息边界和结果后记忆更新顺序。</title><rect x="24" y="258" width="178" height="72" rx="16" fill="#fbfaf4" stroke="#6e8175" stroke-width="2" stroke-dasharray="8 6"/><text x="42" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">时间协议</text><text x="42" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">先定信息截止</text></g><g id="figure-reproduction-comparison" data-figure-atom="comparison" data-figure-step="reproduction" data-figure-part="comparison" role="button" tabindex="0" aria-label="同条件比较：在相同模型、数据、协议和指标口径下比较版本。"><title>同条件比较设计：在相同模型、数据、协议和指标口径下比较版本。</title><rect x="268" y="146" width="172" height="88" rx="16" fill="#f4ecd9" stroke="#6e8175" stroke-width="2" /><text x="354" y="173" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">同条件比较</text><text x="354" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">比较入口</text></g><g id="figure-reproduction-base" data-figure-atom="base" data-figure-step="reproduction" data-figure-part="base" role="button" tabindex="0" aria-label="独立实验臂 · BASE：不使用外部预测记忆的部署基线。"><title>BASE 无外部记忆：不使用外部预测记忆的部署基线。</title><rect x="500" y="30" width="226" height="112" rx="16" fill="#fbfaf4" stroke="#b6c8b8" stroke-width="2" /><text x="514" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">独立实验臂 · BASE</text><text x="514" y="81" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">无外部记忆</text><rect x="512" y="96" width="94" height="28" rx="8" fill="#f4e3df" stroke="#6e8175"/><text x="559" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#26332d" text-anchor="middle">F/R 关</text><rect x="612" y="96" width="104" height="28" rx="8" fill="#f4e3df" stroke="#6e8175"/><text x="664" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#26332d" text-anchor="middle">更新 关</text></g><g id="figure-reproduction-static" data-figure-atom="static" data-figure-step="reproduction" data-figure-part="static" role="button" tabindex="0" aria-label="独立实验臂 · FoCo (Static)：保留初始化记忆、取消每周更新的对照。"><title>FoCo (Static) 静态记忆：保留初始化记忆、取消每周更新的对照。</title><rect x="500" y="154" width="226" height="112" rx="16" fill="#e4f0e4" stroke="#b6c8b8" stroke-width="2" /><text x="514" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#26332d" text-anchor="start">独立实验臂 · FoCo (Static)</text><text x="514" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">初始记忆，不周更</text><rect x="512" y="220" width="94" height="28" rx="8" fill="#e4f0e4" stroke="#6e8175"/><text x="559" y="239" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#26332d" text-anchor="middle">F/R 初始</text><rect x="612" y="220" width="104" height="28" rx="8" fill="#f4e3df" stroke="#6e8175"/><text x="664" y="239" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#26332d" text-anchor="middle">更新 关</text></g><g id="figure-reproduction-ablation" data-figure-atom="ablation" data-figure-step="reproduction" data-figure-part="ablation" role="button" tabindex="0" aria-label="独立实验臂 · F/R 消融：分别去掉因子记忆 F 或推理记忆 R 的组件对照。"><title>F/R 组件消融：分别去掉因子记忆 F 或推理记忆 R 的组件对照。</title><rect x="500" y="278" width="226" height="112" rx="16" fill="#f4e3df" stroke="#b6c8b8" stroke-width="2" /><text x="514" y="303" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">独立实验臂 · F/R 消融</text><text x="514" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">去 F / 去 R</text><rect x="512" y="344" width="94" height="28" rx="8" fill="#f4e3df" stroke="#6e8175"/><text x="559" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#26332d" text-anchor="middle">F 或 R 去掉</text><rect x="612" y="344" width="104" height="28" rx="8" fill="#e4f0e4" stroke="#6e8175"/><text x="664" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#26332d" text-anchor="middle">更新 开</text></g></svg>