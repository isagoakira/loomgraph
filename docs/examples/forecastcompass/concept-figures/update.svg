<svg xmlns="http://www.w3.org/2000/svg" id="figure-update-svg" class="knowledge-concept-figure-svg" viewBox="0 0 760 445" role="group" aria-labelledby="figure-update-title figure-update-description" data-figure-step="update"><title id="figure-update-title">结果前后双轨如何形成记忆修订</title><desc id="figure-update-description">预测轨迹与复盘轨迹对照、诊断聚合、记忆修订示意。结果后信息只作为学习信号，不能倒灌成原预测输入。</desc><defs><marker id="figure-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8175"/></marker></defs><rect x="0" y="0" width="760" height="445" rx="20" fill="#fbfaf4"/><text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#26332d" text-anchor="start">结果揭晓切开两个信息阶段，差异才可进入记忆修订</text><line x1="190" y1="136" x2="190" y2="400" stroke="#b6c8b8" stroke-width="2" stroke-dasharray="8 6"/><text x="190" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">结果揭晓</text><line x1="170" y1="187" x2="214" y2="306" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-update-arrow)"/><text x="192" y="215" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">触发</text><path d="M274 264 C236 236, 236 240, 274 212" fill="none" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-update-arrow)"/><text x="274" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">对照原预测</text><line x1="408" y1="166" x2="446" y2="171" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-update-arrow)"/><text x="427" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">提供基线</text><line x1="408" y1="306" x2="446" y2="171" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-update-arrow)"/><text x="427" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">提供结果后对照</text><line x1="572" y1="171" x2="446" y2="311" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-update-arrow)"/><text x="509" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">汇总差异</text><line x1="572" y1="311" x2="610" y2="171" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-update-arrow)"/><text x="591" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">形成建议</text><line x1="736" y1="171" x2="610" y2="311" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative"  marker-end="url(#figure-update-arrow)"/><text x="673" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">局部写回</text><g id="figure-update-protocol" data-figure-atom="protocol" data-figure-step="update" data-figure-part="protocol" role="button" tabindex="0" aria-label="时间边界：结果前预测 / 结果后学习：守住结果前预测与结果后学习的时间边界。"><title>时间有效的实验协议：守住结果前预测与结果后学习的时间边界。</title><rect x="24" y="52" width="712" height="72" rx="16" fill="#f4ecd9" stroke="#6e8175" stroke-width="2" stroke-dasharray="8 6"/><text x="42" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="start">时间边界：结果前预测 / 结果后学习</text><text x="42" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="start">不可倒灌</text></g><g id="figure-update-outcome" data-figure-atom="outcome" data-figure-step="update" data-figure-part="outcome" role="button" tabindex="0" aria-label="结果揭晓：真实结果揭晓，才产生结果后复盘所需的信息。"><title>结果揭晓：真实结果揭晓，才产生结果后复盘所需的信息。</title><rect x="28" y="145" width="142" height="82" rx="16" fill="#f4e3df" stroke="#6e8175" stroke-width="2" /><text x="99" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#26332d" text-anchor="middle">结果揭晓</text><text x="99" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">信息阶段切换</text></g><g id="figure-update-trajectory" data-figure-atom="trajectory" data-figure-step="update" data-figure-part="trajectory" role="button" tabindex="0" aria-label="预测轨迹：结果揭晓前已经记录的搜证、解释和概率形成过程。"><title>预测轨迹：结果揭晓前已经记录的搜证、解释和概率形成过程。</title><rect x="214" y="124" width="194" height="88" rx="16" fill="#e5eef6" stroke="#6e8175" stroke-width="2" /><text x="311" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">预测轨迹</text><text x="311" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">结果前</text></g><g id="figure-update-retrospective" data-figure-atom="retrospective" data-figure-step="update" data-figure-part="retrospective" role="button" tabindex="0" aria-label="复盘轨迹：结果揭晓后生成的复盘轨迹，只服务未来记忆学习。"><title>复盘轨迹：结果揭晓后生成的复盘轨迹，只服务未来记忆学习。</title><rect x="214" y="264" width="194" height="88" rx="16" fill="#f4e3df" stroke="#6e8175" stroke-width="2" /><text x="311" y="291" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">复盘轨迹</text><text x="311" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">结果后</text></g><g id="figure-update-diagnosis" data-figure-atom="diagnosis" data-figure-step="update" data-figure-part="diagnosis" role="button" tabindex="0" aria-label="差异诊断：定位信号遗漏、因子误用或概率推理差异。"><title>差异诊断：定位信号遗漏、因子误用或概率推理差异。</title><rect x="446" y="130" width="126" height="82" rx="16" fill="#f4ecd9" stroke="#6e8175" stroke-width="2" /><text x="509" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">差异诊断</text><text x="509" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">拆分问题</text></g><g id="figure-update-aggregation" data-figure-atom="aggregation" data-figure-step="update" data-figure-part="aggregation" role="button" tabindex="0" aria-label="模式聚合：从多条差异中留下反复出现且可复用的模式。"><title>差异聚合：从多条差异中留下反复出现且可复用的模式。</title><rect x="446" y="270" width="126" height="82" rx="16" fill="#f4ecd9" stroke="#6e8175" stroke-width="2" /><text x="509" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">模式聚合</text><text x="509" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">过滤偶然偏差</text></g><g id="figure-update-revision" data-figure-atom="revision" data-figure-step="update" data-figure-part="revision" role="button" tabindex="0" aria-label="局部修订：把聚合后的建议写回受影响的未来记忆内容。"><title>局部记忆修订：把聚合后的建议写回受影响的未来记忆内容。</title><rect x="610" y="130" width="126" height="82" rx="16" fill="#ece7f5" stroke="#6e8175" stroke-width="2" /><text x="673" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">局部修订</text><text x="673" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">只改相关内容</text></g><g id="figure-update-memory" data-figure-atom="memory" data-figure-step="update" data-figure-part="memory" role="button" tabindex="0" aria-label="未来记忆：更新后的双记忆状态服务更晚的问题。"><title>子类别双记忆状态：更新后的双记忆状态服务更晚的问题。</title><rect x="610" y="270" width="126" height="82" rx="16" fill="#e4f0e4" stroke="#6e8175" stroke-width="2" /><text x="673" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">未来记忆</text><text x="673" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">供后续预测</text></g></svg>