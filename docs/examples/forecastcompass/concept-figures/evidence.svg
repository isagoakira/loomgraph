63</text><text x="662" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#26332d" text-anchor="start">Static</text><text x="767" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">B 0.203</text><text x="826" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">E 0.219</text><text x="662" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#26332d" text-anchor="start">FoCo</text><text x="767" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">B 0.187</text><text x="826" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#26332d" text-anchor="start">E 0.195</text></g><g id="figure-evidence-table3" data-figure-atom="table3-ablation" data-figure-step="evidence" data-figure-part="table3" role="button" tabindex="0" aria-label="Table 3 · 消融：Table 3 的固定条件下逐周及平均 F/R 消融。"><title>Table 3 F/R 消融证据：Table 3 的固定条件下逐周及平均 F/R 消融。</title><rect x="650" y="252" width="220" height="236" rx="16" fill="#ffffff" stroke="#b6c8b8" stroke-width="2" /><text x="662" y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#26332d" text-anchor="start">Table 3 · 消融</text><text x="662" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="s