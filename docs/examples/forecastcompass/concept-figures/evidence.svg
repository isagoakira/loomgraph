<svg xmlns="http://www.w3.org/2000/svg" id="figure-evidence-svg" class="knowledge-concept-figure-svg" viewBox="0 0 900 510" role="group" aria-labelledby="figure-evidence-title figure-evidence-description" data-figure-step="evidence"><title id="figure-evidence-title">Brier/ECE 两个评价视角与证据分层</title><desc id="figure-evidence-description">指标、主结果与消融证据示意。Brier 看概率距离；ECE 看信心匹配；主结果与组件消融回答不同问题。</desc><defs><marker id="figure-evidence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8175"/></marker></defs><rect x="0" y="0" width="900" height="510" rx="20" fill="#fbfaf4"/><text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#26332d" text-anchor="start">两个指标看不同问题，表格再把主结果和消融拆开</text><line x1="178" y1="103" x2="210" y2="98" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative" /><text x="194" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">评价</text><line x1="178" y1="231" x2="210" y2="229" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative" /><text x="194" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">分箱</text><line x1="380" y1="98" x2="412" y2="76" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative" /><text x="396" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">准确性口径</text><line x1="380" y1="229" x2="412" y2="98" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative" /><text x="396" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">校准口径</text><line x1="295" y1="284" x2="295" y2="302" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative" /><text x="295" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">校准</text><line x1="554" y1="76" x2="650" y2="92" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative" /><text x="602" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">主结果</text><line x1="554" y1="99" x2="650" y2="340" stroke="#6e8175" stroke-width="2.4" data-figure-relation="illustrative" /><text x="602" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#6e8175" text-anchor="middle">组件对照</text><g id="figure-evidence-probability" data-figure-atom="probability" data-figure-step="evidence" data-figure-part="probability" role="button" tabindex="0" aria-label="完整概率分布：完整概率分布是 Brier 的评价对象。"><title>概率预测：完整概率分布是 Brier 的评价对象。</title><rect x="24" y="62" width="154" height="82" rx="16" fill="#e5eef6" stroke="#6e8175" stroke-width="2" /><text x="101" y="89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">完整概率分布</text><text x="101" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">真实结果对应候选记为 1</text></g><g id="figure-evidence-brier" data-figure-atom="brier" data-figure-step="evidence" data-figure-part="brier" role="button" tabindex="0" aria-label="Brier · 概率距离：比较预测概率与真实结果的多类平方误差距离。"><title>Brier 概率准确性：比较预测概率与真实结果的多类平方误差距离。</title><rect x="210" y="50" width="170" height="98" rx="16" fill="#e4f0e4" stroke="#6e8175" stroke-width="2" /><text x="295" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">Brier · 概率距离</text><text x="295" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">完整分布的平方误差</text></g><g id="figure-evidence-confidence" data-figure-atom="confidence" data-figure-step="evidence" data-figure-part="confidence" role="button" tabindex="0" aria-label="最大概率 = 信心：每次预测分布中的最大概率作为信心。"><title>预测信心：每次预测分布中的最大概率作为信心。</title><rect x="24" y="190" width="154" height="82" rx="16" fill="#e5eef6" stroke="#6e8175" stroke-width="2" /><text x="101" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">最大概率 = 信心</text><text x="101" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">ECE 的输入</text></g><g id="figure-evidence-ece" data-figure-atom="ece" data-figure-step="evidence" data-figure-part="ece" role="button" tabindex="0" aria-label="ECE · 信心匹配：按信心分箱比较经验正确率与平均信心。"><title>ECE 校准误差：按信心分箱比较经验正确率与平均信心。</title><rect x="210" y="174" width="170" height="110" rx="16" fill="#ece7f5" stroke="#6e8175" stroke-width="2" /><text x="295" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">ECE · 信心匹配</text><text x="295" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">最大信心的分箱匹配</text></g><g id="figure-evidence-calibration" data-figure-atom="calibration" data-figure-step="evidence" data-figure-part="calibration" role="button" tabindex="0" aria-label="校准：校准关注信心与实际正确率是否匹配。"><title>校准：校准关注信心与实际正确率是否匹配。</title><rect x="210" y="302" width="170" height="72" rx="16" fill="#ece7f5" stroke="#6e8175" stroke-width="2" /><text x="295" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">校准</text><text x="295" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">一组预测</text></g><g id="figure-evidence-comparison" data-figure-atom="comparison" data-figure-step="evidence" data-figure-part="comparison" role="button" tabindex="0" aria-label="同条件比较：把完整 FoCo、BASE、Static 和 F/R 消融放在同条件下比较。"><title>同条件比较设计：把完整 FoCo、BASE、Static 和 F/R 消融放在同条件下比较。</title><rect x="412" y="46" width="142" height="72" rx="16" fill="#f4ecd9" stroke="#6e8175" stroke-width="2" /><text x="483" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#26332d" text-anchor="middle">同条件比较</text><text x="483" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">固定模型/数据/协议</text></g><g id="figure-evidence-base" data-figure-atom="base" data-figure-step="evidence" data-figure-part="base" role="button" tabindex="0" aria-label="BASE：无外部记忆的部署基线。"><title>BASE 无外部记忆：无外部记忆的部署基线。</title><rect x="408" y="140" width="82" height="72" rx="16" fill="#fbfaf4" stroke="#6e8175" stroke-width="2" /><text x="449" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#26332d" text-anchor="middle">BASE</text><text x="449" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">无外部记忆</text></g><g id="figure-evidence-static" data-figure-atom="static" data-figure-step="evidence" data-figure-part="static" role="button" tabindex="0" aria-label="Static：保留初始记忆但不周更的对照。"><title>FoCo (Static) 静态记忆：保留初始记忆但不周更的对照。</title><rect x="500" y="140" width="82" height="72" rx="16" fill="#fbfaf4" stroke="#6e8175" stroke-width="2" /><text x="541" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#26332d" text-anchor="middle">Static</text><text x="541" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">不周更</text></g><g id="figure-evidence-ablation" data-figure-atom="ablation" data-figure-step="evidence" data-figure-part="ablation" role="button" tabindex="0" aria-label="F/R 消融：分别去掉 F 或 R 的同条件组件对照。"><title>F/R 组件消融：分别去掉 F 或 R 的同条件组件对照。</title><rect x="408" y="230" width="174" height="76" rx="16" fill="#f4e3df" stroke="#6e8175" stroke-width="2" /><text x="495" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#26332d" text-anchor="middle">F/R 消融</text><text x="495" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#607069" text-anchor="middle">去 F / 去 R</text></g><g id="figure-evidence-table1" data-figure-atom="table1-result" data-figure-step="evidence" data-figure-part="table1" role="button" tabindex="0" aria-label="Table 1 · 主结果：