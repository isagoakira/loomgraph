<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Loomgraph: your project, a shared canvas, and scoped feedback</title>
  <desc id="desc">An Agent works in your project, maintains a canvas combining knowledge and workflows, and receives independent feedback through your existing conversation.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#26362e" flood-opacity=".055"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6d8278" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text {font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#263b32}
      .muted{fill:#697a71}.eyebrow{font-size:12px;font-weight:650;letter-spacing:1.9px}.heading{font-size:23px;font-weight:650}.body{font-size:15px}.small{font-size:13px}
      .route{fill:none;stroke:#7b9085;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="820" fill="#f6f4ed"/>
  <g stroke="#3d755c" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M58 45V79H92M69 45V68H92M58 56H81V79"/></g>
  <text x="108" y="72" font-size="31" font-weight="700" letter-spacing="-.8">Loomgraph</text>
  <text x="52" y="132" font-size="34" font-weight="600" letter-spacing="-.7">Weave thought into action.</text>
  <text x="53" y="167" font-size="18" class="muted">Your project. A shared canvas. A conversation that stays connected.</text>

  <g filter="url(#shadow)"><rect x="52" y="210" width="286" height="528" rx="18" fill="#fffefa" stroke="#e0e5dc"/><rect x="372" y="210" width="688" height="528" rx="18" fill="#fffefa" stroke="#e0e5dc"/><rect x="1094" y="210" width="294" height="528" rx="18" fill="#fffefa" stroke="#e0e5dc"/></g>

  <text x="78" y="250" class="eyebrow muted">YOUR PROJECT</text>
  <text x="78" y="286" class="heading">Work where you are.</text>
  <rect x="78" y="314" width="234" height="116" rx="12" fill="#f1f3ed"/>
  <text x="96" y="343" class="body" font-weight="600">Goals &amp; materials</text>
  <text x="96" y="372" class="body muted">Documents · code · evidence</text>
  <text x="96" y="401" class="body muted">Your existing workspace</text>
  <path d="M195 444V471" class="route" marker-end="url(#arrow)"/>
  <rect x="78" y="485" width="234" height="123" rx="12" fill="#eaf0e9" stroke="#d1dfd2"/>
  <text x="96" y="516" class="heading" font-size="20">Your Agent</text>
  <text x="96" y="547" class="body muted">Plan · explain · act</text>
  <text x="96" y="579" class="small muted">Connected through local MCP</text>
  <text x="78" y="651" class="body">Keep working in your project.</text>
  <text x="78" y="679" class="body muted">Maintain the canvas as you go.</text>
  <path d="M341 542H365" class="route" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text x="400" y="250" class="eyebrow muted">SHARED CANVAS</text>
  <text x="400" y="286" class="heading">Knowledge + workflows, together.</text>
  <rect x="409" y="315" width="164" height="99" rx="12" fill="#eaf1e8" stroke="#cad9c5"/>
  <text x="427" y="349" class="heading" font-size="20">Goal</text>
  <text x="427" y="380" class="body muted">What matters?</text>
  <rect x="627" y="315" width="163" height="99" rx="12" fill="#f3eddb" stroke="#ded3b7"/>
  <text x="645" y="349" class="heading" font-size="20">Plan</text>
  <text x="645" y="380" class="body muted">Options &amp; trade-offs</text>
  <rect x="845" y="315" width="188" height="99" rx="12" fill="#eaf0f2" stroke="#cbd9df"/>
  <text x="863" y="349" class="heading" font-size="20">Work</text>
  <text x="863" y="380" class="body muted">Stages &amp; evidence</text>
  <path d="M574 360H617" class="route" marker-end="url(#arrow)"/>
  <path d="M791 360H835" class="route" marker-end="url(#arrow)"/>
  <path d="M709 415V436M660 436H812M660 436V451M812 436V451" class="route"/>
  <rect x="604" y="455" width="112" height="53" rx="9" fill="#fffefa" stroke="#d6dcd2"/>
  <rect x="756" y="455" width="112" height="53" rx="9" fill="#fffefa" stroke="#d6dcd2"/>
  <text x="660" y="487" text-anchor="middle" class="body">Option A</text>
  <text x="812" y="487" text-anchor="middle" class="body">Option B</text>
  <rect x="410" y="549" width="622" height="148" rx="12" fill="#f7f6ef" stroke="#e8e7dd"/>
  <text x="431" y="582" class="body" font-weight="650">Context stays beside the structure.</text>
  <text x="431" y="616" class="body muted">Text, images and concept diagrams share the same space.</text>
  <text x="431" y="643" class="body muted">Open details locally. Keep each group readable.</text>
  <rect x="431" y="660" width="263" height="22" rx="11" fill="#e6eee3"/>
  <text x="442" y="675" font-size="11.5" fill="#45684e">Execution motion follows verified receipts.</text>

  <text x="1120" y="250" class="eyebrow muted">SCOPED FEEDBACK</text>
  <text x="1120" y="286" class="heading">Point. Ask. Refine.</text>
  <rect x="1120" y="315" width="242" height="101" rx="11" fill="#f0ecf5" stroke="#dbd3e7"/>
  <text x="1138" y="345" class="small muted">01 · SELECTED GROUP</text>
  <text x="1138" y="378" class="body" font-weight="600">Compare the options.</text>
  <rect x="1120" y="435" width="242" height="101" rx="11" fill="#f0ecf5" stroke="#dbd3e7"/>
  <text x="1138" y="465" class="small muted">02 · SELECTED RELATION</text>
  <text x="1138" y="498" class="body" font-weight="600">Explain this connection.</text>
  <path d="M1241 550V575" class="route" marker-end="url(#arrow)"/>
  <text x="1120" y="608" class="body" font-weight="600">Hand off in your conversation.</text>
  <text x="1120" y="636" class="body muted">Independent requests.</text>
  <text x="1120" y="663" class="body muted">Individual replies &amp; changes.</text>
  <text x="1120" y="701" class="small muted">You stay in control of each revision.</text>

  <text x="1388" y="783" text-anchor="end" class="small muted">Loomgraph</text>
</svg>
